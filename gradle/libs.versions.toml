[versions]
agp = "8.7.3"
kotlin = "2.2.20"
composeMultiplatform = "1.9.3"
androidxActivityCompose = "1.9.2"
androidxAppcompat = "1.7.0"
material = "1.12.0"
ktor = "3.0.1"
kotlinxCoroutines = "1.9.0"
lottieCompose = "6.7.1"
# 3.13.0, not latest (4.x): Gradle Play Publisher 4.x requires Gradle 9.1+, and this project
# runs Gradle 8.13 (matching AGP 8.7.3 / Kotlin 2.2.20) — confirmed live, 4.1.1 refuses to even
# apply here. 3.13.0 is the newest release still on the Gradle 8.x line. Revisit once the whole
# toolchain moves to Gradle 9.
gradlePlayPublisher = "3.13.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
android-material = { module = "com.google.android.material:material", version.ref = "material" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-android = { module = "io.ktor:ktor-client-android", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
lottie-compose = { module = "com.airbnb.android:lottie-compose", version.ref = "lottieCompose" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
gradlePlayPublisher = { id = "com.github.triplet.play", version.ref = "gradlePlayPublisher" }
