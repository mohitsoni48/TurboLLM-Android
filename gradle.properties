org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
# byte-buddy (via ktor-server-test-host -> kotlinx-coroutines-debug) ships Java 24 classes Jetifier cannot read;
# it holds no support-library references, so it is skipped rather than transformed.
android.jetifier.ignorelist=byte-buddy
kotlin.mpp.stability.nowarn=true
kotlin.mpp.androidSourceSetLayoutVersion=2
