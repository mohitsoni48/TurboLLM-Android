<!--
  TurboLLM Play Store listing icon — SVG source.
  Reproduces the shipped brand mark exactly: the bolt path is copied verbatim from
  turbollm/web/src/components/Logo.tsx (BoltMark, viewBox 0 0 24 24), scaled onto a
  512x512 tile filled with the real light-theme accent token (--accent: #c96442,
  turbollm/web/src/index.css). This is the same mark used for the Android launcher icon
  (composeApp/src/androidMain/res/values/ic_launcher_background.xml samples the same
  source image, turbollm-icon-512.jpeg) — not a new design.

  To rasterize to PNG (512x512, no alpha needed — Play Store accepts a flat 32-bit PNG):
    python -c "import cairosvg; cairosvg.svg2png(url='app-icon-512.svg', write_to='app-icon-512-from-svg.png', output_width=512, output_height=512)"
  or, since Inkscape/rsvg are more commonly preinstalled:
    inkscape app-icon-512.svg --export-type=png --export-filename=app-icon-512-from-svg.png -w 512 -h 512
  The actual shipped icon.png in this folder was produced more directly (no SVG round-trip
  needed) by converting the existing master raster asset:
    python -c "from PIL import Image; Image.open('turbollm/web/public/brand/turbollm-icon-512.jpeg').convert('RGB').save('app-icon-512.png','PNG')"
  Keep both in sync if the brand mark ever changes: update Logo.tsx's BoltMark path here too.
-->
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="#c96442"/>
  <g transform="translate(96,96) scale(13.33)">
    <path d="M13.4 2.2 6.4 12.9 10.8 12.9 9.8 21.8 17.4 10.6 12.9 10.6Z" fill="#ffffff"/>
  </g>
</svg>
