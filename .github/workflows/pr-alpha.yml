name: Publish to Play (PR → alpha, main → open testing)

# Every PR push uploads a signed release bundle to the Play "alpha" (closed testing) track, so
# testers can install what the PR does; every merge to main uploads one to "beta" (open testing).
# See RELEASING.md § "CI: Play publishing".
#
# One workflow on purpose (hence the file name no longer matching): its run number is the
# versionCode "attempt", and two workflows would each count from 1 and collide on codes.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  # Re-running a failed job reuses its run number, which Play rejects if the bundle already went
  # up. Dispatching a fresh run gets a new number. Publishes to beta, and only works from main
  # (the play-beta environment is restricted to that branch).
  workflow_dispatch:

# A newer push supersedes an in-flight PR build. A main build is never cancelled mid-upload.
# Each track only holds ONE current release, so whichever upload lands last is what testers get.
concurrency:
  group: play-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODEJS_MOBILE_VERSION: v18.20.4

jobs:
  publish-alpha:
    # Secrets are not exposed to PRs from forks, and a fork PR must never reach the signing key
    # in any case — only PRs from branches of this repo publish.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Each environment holds its own copy of the signing + Play secrets.
    #  - play-alpha (PRs): needs the owner's approval for every run. That approval is what stops a
    #    PR that edits this workflow or the build scripts from reading them — review the diff.
    #  - play-beta (main): no approval, but restricted to the main branch, which only the owner can
    #    change (PR + code-owner review). A PR branch cannot use this environment at all.
    environment: ${{ github.event_name == 'pull_request' && 'play-alpha' || 'play-beta' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check required secrets
        env:
          HAVE_KEYSTORE: ${{ secrets.TURBOLLM_UPLOAD_KEYSTORE_BASE64 != '' }}
          HAVE_STORE_PW: ${{ secrets.TURBOLLM_UPLOAD_STORE_PASSWORD != '' }}
          HAVE_ALIAS: ${{ secrets.TURBOLLM_UPLOAD_KEY_ALIAS != '' }}
          HAVE_KEY_PW: ${{ secrets.TURBOLLM_UPLOAD_KEY_PASSWORD != '' }}
          HAVE_PLAY: ${{ secrets.TURBOLLM_PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          missing=0
          for v in KEYSTORE:TURBOLLM_UPLOAD_KEYSTORE_BASE64 STORE_PW:TURBOLLM_UPLOAD_STORE_PASSWORD \
                   ALIAS:TURBOLLM_UPLOAD_KEY_ALIAS KEY_PW:TURBOLLM_UPLOAD_KEY_PASSWORD \
                   PLAY:TURBOLLM_PLAY_SERVICE_ACCOUNT_JSON; do
            flag="HAVE_${v%%:*}"
            if [ "${!flag}" != "true" ]; then
              echo "::error::Repository secret ${v#*:} is not set"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The Android app is a shell around the TurboLLM daemon, which lives in its own repo and is
      # bundled into the APK (scripts/stage-daemon-assets.mjs). Public repo, so no token needed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: mohitsoni48/TurboLLM
          ref: main
          path: turbollm-src

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # SDK pieces the build asks for. ubuntu-latest ships the SDK itself; these make the
      # cmake/NDK/platform versions deterministic instead of relying on AGP's auto-download.
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "cmake;3.22.1" "ndk;27.0.12077973" > /dev/null

      # libnode.so is a gitignored build input (~190 MB). scripts/fetch-libnode.mjs downloads the
      # 16 KB-aligned nodejs-mobile ${{ env.NODEJS_MOBILE_VERSION }} build from the digidem fork (the
      # upstream release is 4 KB-aligned, which Android 15+ 16 KB-page devices cannot load) and checks
      # the archive and each extracted libnode.so against the SHA-256s pinned in the script and
      # recorded in PROVENANCE.md. The build's preBuild runs the same script, so this step only makes
      # the fetch, and any mismatch, visible on its own; it is the binary CI verified that ships.
      - name: Fetch libnode (nodejs-mobile ${{ env.NODEJS_MOBILE_VERSION }}, digidem 16 KB build)
        run: node scripts/fetch-libnode.mjs

      # Daemon + web UI packages. stage-daemon-assets.mjs builds both itself: the Android daemon
      # bundle every time, and the web UI (into turbollm/src/webdist) whenever web/ is not what it
      # was last built from there, which on this fresh checkout is always. A web build here would
      # leave no record of its sources, so staging would build it a second time.
      - name: Install the TurboLLM daemon and web UI packages
        working-directory: turbollm-src/turbollm
        run: |
          npm ci
          (cd web && npm ci)

      - name: Materialise signing + Play credentials
        env:
          KEYSTORE_B64: ${{ secrets.TURBOLLM_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_JSON: ${{ secrets.TURBOLLM_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf '%s' "$PLAY_JSON" > "$RUNNER_TEMP/play-account.json"
          # Picked up by composeApp/build.gradle.kts (env vars override local.properties).
          {
            echo "TURBOLLM_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks"
            echo "TURBOLLM_PLAY_SERVICE_ACCOUNT=$RUNNER_TEMP/play-account.json"
          } >> "$GITHUB_ENV"

      # -x stagePlayListing: the store listing's screenshots/icon are gitignored, and a PR build
      # only uploads the bundle — it must not rewrite the store listing anyway.
      # The run number is the versionCode "attempt" (build.gradle.kts): unique and ascending, so
      # Play accepts every push. Re-running a job that already uploaded reuses its run number
      # and Play will reject the duplicate code — push a new commit instead.
      - name: Build and publish to the ${{ github.event_name == 'pull_request' && 'alpha' || 'beta (open testing)' }} track
        env:
          TURBOLLM_UPLOAD_STORE_PASSWORD: ${{ secrets.TURBOLLM_UPLOAD_STORE_PASSWORD }}
          TURBOLLM_UPLOAD_KEY_ALIAS: ${{ secrets.TURBOLLM_UPLOAD_KEY_ALIAS }}
          TURBOLLM_UPLOAD_KEY_PASSWORD: ${{ secrets.TURBOLLM_UPLOAD_KEY_PASSWORD }}
        run: |
          set -o pipefail   # the default run shell has none, and `| tee` would mask a Gradle failure
          chmod +x gradlew
          # An alpha and a beta upload can overlap, and the Play API invalidates an open edit when
          # another edit commits. A failed edit is not persisted, so retrying is safe — but only
          # retry that specific conflict; a real build failure should fail straight away.
          for attempt in 1 2 3; do
            if ./gradlew :composeApp:publishReleaseBundle \
                -x stagePlayListing \
                -PturbollmPlayTrack=${{ github.event_name == 'pull_request' && 'alpha' || 'beta' }} \
                -PturbollmReleaseAttempt="${{ github.run_number }}" \
                -Pturbollm.dir="$GITHUB_WORKSPACE/turbollm-src/turbollm" \
                --stacktrace 2>&1 | tee "$RUNNER_TEMP/publish.log"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ] && grep -qiE 'edit.*(invalid|expired|no longer|not found|conflict)|(another|concurrent) (edit|modification|update)' "$RUNNER_TEMP/publish.log"; then
              echo "::warning::Play edit conflict, retrying ($attempt/3)"; sleep 45
            else
              exit 1
            fi
          done

      - name: Summary
        if: success()
        run: |
          version=$(node -p "require('./turbollm-src/turbollm/package.json').version")
          {
            echo "### Published to Play ${{ github.event_name == 'pull_request' && 'alpha' || 'beta (open testing)' }}"
            echo "- versionName: \`$version\`"
            echo "- build: run #${{ github.run_number }} (${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || 'main' }}, \`${GITHUB_SHA::7}\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/play-account.json"
